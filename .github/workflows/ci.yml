name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      providers:
        description: "Cloud providers to run the conformance suite against, space separated (e.g. e2b daytona), or all"
        default: ""
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:docker
  cloud-conformance:
    # Real VMs cost money: only on request.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.providers != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { provider: [agent37, beam, blaxel, boat, codesandbox, daytona, e2b, fly, freestyle, hopx, modal, morph, runloop, sprites, upstash, vercel] }
    steps:
      - uses: actions/checkout@v4
        if: (github.event.inputs.providers == 'all' || contains(format(' {0} ', github.event.inputs.providers), format(' {0} ', matrix.provider)))
      - uses: pnpm/action-setup@v4
        if: (github.event.inputs.providers == 'all' || contains(format(' {0} ', github.event.inputs.providers), format(' {0} ', matrix.provider)))
      - uses: actions/setup-node@v4
        if: (github.event.inputs.providers == 'all' || contains(format(' {0} ', github.event.inputs.providers), format(' {0} ', matrix.provider)))
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run test:${{ matrix.provider }}
        if: (github.event.inputs.providers == 'all' || contains(format(' {0} ', github.event.inputs.providers), format(' {0} ', matrix.provider)))
        env:
          AGENT37_API_KEY: ${{ secrets.AGENT37_API_KEY }}
          BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}
          BEAM_WORKSPACE_ID: ${{ secrets.BEAM_WORKSPACE_ID }}
          BL_API_KEY: ${{ secrets.BL_API_KEY }}
          BL_WORKSPACE: ${{ secrets.BL_WORKSPACE }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          CSB_API_KEY: ${{ secrets.CSB_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          HOPX_API_KEY: ${{ secrets.HOPX_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MORPH_API_KEY: ${{ secrets.MORPH_API_KEY }}
          RUNLOOP_API_KEY: ${{ secrets.RUNLOOP_API_KEY }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  publish:
    # Every push to main publishes @invertix/open-sb to npm, so consumers pick it up through their
    # dependency bots. The version in package.json is the floor: when it is already on npm, the next
    # patch is published instead, so routine changes need no version bump and minors stay manual.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: npm-publish, cancel-in-progress: false }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pick the version
        run: |
          published=$(npm view @invertix/open-sb version 2>/dev/null || true)
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const parse = (v) => v.split(".").map(Number);
            const published = process.argv[1];
            let next = pkg.version;
            if (published) {
              const [a, b, c] = parse(published);
              const bumped = `${a}.${b}.${c + 1}`;
              const cmp = (x, y) => { const p = parse(x), q = parse(y); for (let i = 0; i < 3; i++) if (p[i] !== q[i]) return p[i] - q[i]; return 0; };
              if (cmp(next, published) <= 0) next = bumped;
            }
            pkg.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`publishing ${next} (npm has ${published || "nothing"})`);
          ' "$published"
      - run: rm -rf dist && pnpm run build
      # Trusted publishing (OIDC) once it is set up on npmjs.com; NPM_TOKEN only bootstraps it.
      - run: npm publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
