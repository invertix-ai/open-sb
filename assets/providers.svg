<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">open-sb providers and capabilities</title>
  <desc id="desc">One interface, open-sb, over 17 sandbox providers: E2B, Daytona, Vercel Sandbox, Modal, Fly Sprites, Fly Machines, Runloop, CodeSandbox, Morph Cloud, Blaxel, Upstash Box, Freestyle, HOPX, Beam, Boat, Agent37, Docker. A mark shows each optional capability a provider supports.</desc>
  <style>
    .bg { fill: #ffffff; }
    .hub { fill: #111827; }
    .hub-text { fill: #ffffff; }
    .hub-muted { fill: #9ca3af; }
    .stripe { fill: #f6f8fa; }
    .own { fill: none; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .text { fill: #111827; }
    .muted { fill: #6b7280; }
    .rule { stroke: #e5e7eb; stroke-width: 1; }
    .on { fill: #10b981; }
    .tick { fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .off { fill: #d1d5db; }
    .code { fill: #374151; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .hub { fill: #f9fafb; }
      .hub-text { fill: #0d1117; }
      .hub-muted { fill: #4b5563; }
      .stripe { fill: #161b22; }
      .own { stroke: #6e7681; }
      .text { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .rule { stroke: #30363d; }
      .on { fill: #2ea043; }
      .tick { stroke: #0d1117; }
      .off { fill: #30363d; }
      .code { fill: #c9d1d9; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

