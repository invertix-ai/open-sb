<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open-sb playground</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">open-sb</span>
      <span class="brand-sub">playground</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="top-actions">
      <button class="btn ghost" id="claude-button" type="button">Claude key</button>
      <button class="btn ghost" id="history-button" type="button">History</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Providers</span>
        <div class="sidebar-tools">
          <button class="link-btn" id="select-available" type="button">All available</button>
          <button class="link-btn" id="select-none" type="button">None</button>
        </div>
      </div>
      <ul class="provider-list" id="provider-list"></ul>
      <div class="sidebar-foot">
        <button class="btn ghost wide" id="cleanup-button" type="button" title="Destroy every sandbox labelled open-sb.playground that no active run owns">Clean up sandboxes</button>
        <p class="fine">Click a provider to enter its keys. Keys stay on the server (environment variables or a 0600 file) and never come back to this page.</p>
      </div>
    </aside>

    <main class="main">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <section class="toolbar">
        <div class="options" id="options"></div>
        <div class="run-controls">
          <span class="run-state" id="run-state"></span>
          <button class="btn danger" id="cancel-button" type="button" hidden>Cancel</button>
          <button class="btn primary" id="run-button" type="button">Run</button>
        </div>
      </section>
      <section class="results" id="results"></section>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Run history</h2>
      <button class="btn ghost" id="drawer-close" type="button">Close</button>
    </div>
    <p class="fine">Kept in memory until the server stops. Export saves a run with all its events as JSON.</p>
    <ul class="history" id="history"></ul>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <dialog class="modal" id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <div id="confirm-body"></div>
      <menu>
        <button class="btn ghost" value="cancel">Back</button>
        <button class="btn primary" value="ok" id="confirm-ok">Start</button>
      </menu>
    </form>
  </dialog>

  <dialog class="modal setup" id="setup" aria-labelledby="setup-title">
    <div class="setup-head">
      <h2 id="setup-title"></h2>
      <button class="btn ghost small" type="button" id="setup-close">Close</button>
    </div>
    <div id="setup-body"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
